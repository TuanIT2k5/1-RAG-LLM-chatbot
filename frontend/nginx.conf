# ==============================================================================
# [SP6-04.2] Cấu hình Nginx phục vụ giao diện React SPA tốc độ cao & Reverse Proxy
# ==============================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cho phép tải lên tệp tài liệu PDF/DOCX dung lượng lớn (Backend giới hạn ở 20MB)
    client_max_body_size 25M;

    # Bật nén Gzip tăng tốc độ tải tài nguyên tĩnh (JS, CSS, JSON, SVG)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Lưu đệm tài nguyên tĩnh đã băm tên tệp (Vite assets)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Chuyển tiếp toàn bộ yêu cầu /api/* sang dịch vụ FastAPI Backend trong mạng Docker
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Đảm bảo thời gian chờ đủ cho tác vụ băm vector và suy luận LLM
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Hỗ trợ định tuyến SPA (React)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
