# A generic, single database configuration for Alembic.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
path_separator = os

# URL kết nối thực tế được ghi đè động từ app.core.config.settings.DATABASE_URL trong migrations/env.py
sqlalchemy.url = postgresql+psycopg2://postgres:postgres@localhost:5432/doc_chatbot


[post_write_hooks]


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
