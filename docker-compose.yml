# ==============================================================================
# [SP6-04.3] Cấu hình Docker Compose triển khai toàn diện hệ thống RAG Chatbot
# Kết nối 3 dịch vụ: postgres (CSDL quan hệ), backend (FastAPI + ChromaDB), frontend (Nginx + React)
# Khởi chạy bằng 1 lệnh duy nhất: docker compose up --build -d
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Dịch vụ Cơ sở dữ liệu Quan hệ PostgreSQL 16
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: doc_chatbot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-doc_chatbot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-doc_chatbot}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rag_network

  # ----------------------------------------------------------------------------
  # 2. Dịch vụ Backend API & Luồng xử lý RAG (FastAPI + ChromaDB + BGE-M3)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doc_chatbot_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-Intelligent Document Chatbot}
      APP_ENV: ${APP_ENV:-production}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://localhost:80}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-doc_chatbot}
      CHROMA_PERSIST_DIR: /app/storage/chroma_db
      UPLOAD_DIR: /app/storage/uploads
      HF_HOME: /app/storage/model_cache
      SENTENCE_TRANSFORMERS_HOME: /app/storage/model_cache
      TORCH_HOME: /app/storage/model_cache
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-20}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_API_KEY: ${LLM_API_KEY:-your_api_key_here}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-m3}
      CHUNK_SIZE: ${CHUNK_SIZE:-400}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-60}
      TOP_K: ${TOP_K:-5}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-5}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - chroma_data:/app/storage/chroma_db
      - uploads_data:/app/storage/uploads
      - model_cache:/app/storage/model_cache
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - rag_network

  # ----------------------------------------------------------------------------
  # 3. Dịch vụ Giao diện người dùng Web (React 18 SPA + Nginx Reverse Proxy)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: doc_chatbot_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - rag_network

# ==============================================================================
# Khai báo các ổ đĩa lưu trữ bền vững (Persistent Named Volumes)
# ==============================================================================
volumes:
  postgres_data:
    name: doc_chatbot_postgres_data
  chroma_data:
    name: doc_chatbot_chroma_data
  uploads_data:
    name: doc_chatbot_uploads_data
  model_cache:
    name: doc_chatbot_model_cache

# ==============================================================================
# Mạng nội bộ cô lập giữa 3 dịch vụ
# ==============================================================================
networks:
  rag_network:
    name: doc_chatbot_rag_network
    driver: bridge
